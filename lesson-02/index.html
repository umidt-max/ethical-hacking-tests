<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ethical Hacking — 2-dars testi</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#16243c;background:#edf2f9}*{box-sizing:border-box}main{max-width:820px;margin:36px auto;padding:0 16px 50px}.hero{background:linear-gradient(120deg,#10355b,#0b6978);color:white;padding:30px;border-radius:20px}.hero h1{margin:0 0 8px}.hero p{opacity:.9;margin:0}.bar{height:10px;background:#d4deeb;border-radius:99px;margin:22px 0;overflow:hidden}.bar span{display:block;background:#0f9984;height:100%;width:0;transition:width .2s}.question{background:white;border:1px solid #dbe3ee;padding:22px;border-radius:16px;margin:14px 0;box-shadow:0 3px 10px #0e315209}.question h3{margin:0 0 15px;font-size:1.04rem}.option{display:block;border:1px solid #dce5ef;padding:12px;margin:8px 0;border-radius:10px;cursor:pointer}.option:has(input:checked){background:#e5f4ff;border-color:#2877b4}.option input{margin-right:10px;accent-color:#0c6789}.correct{border-left:5px solid #188b68}.incorrect{border-left:5px solid #d05757}.explain{color:#3c5369;background:#f1f5f9;padding:12px;border-radius:9px;margin-top:12px}button{background:#0d5c86;color:white;border:0;padding:14px 24px;border-radius:11px;font-size:1rem;font-weight:700;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#52647b}.actions{display:flex;gap:10px;flex-wrap:wrap}.result{background:white;padding:24px;border-radius:18px;margin:20px 0;border:2px solid #0f9984}.small{font-size:.87rem;color:#4d637c}.hide{display:none}footer{text-align:center;color:#53677e;font-size:.85rem;margin:35px 0}</style></head><body><main><section class="hero"><h1>ETHICAL HACKING · 2-DARS</h1><p>Kompyuter arxitekturasi, operatsion tizim, Kernel, Process va Thread</p><p style="margin-top:12px">20 savol · 100 ball · Izohli natijalar</p></section><p id="count" class="small">0 / 20 javob berildi</p><div class="bar"><span id="progress"></span></div><div id="questions"></div><div class="actions"><button id="submit" disabled>Testni yakunlash</button><button id="restart" class="secondary hide">Qayta topshirish</button></div><section id="result" class="result hide" aria-live="polite"></section><footer>ALI · Ethical Hacking o‘quv laboratoriyasi · 2-dars</footer></main><script>
const questions=[{"q": "CPU ning asosiy vazifasi nima?", "o": ["Fayllarni doimiy saqlash", "Dastur ko‘rsatmalarini bajarish", "Internet signalini kuchaytirish", "Monitorni elektr bilan ta’minlash"], "a": 1, "e": "CPU dastur ko‘rsatmalarini bajaradi."}, {"q": "Kompyuter o‘chirilganda odatda qaysi xotira ma’lumotni yo‘qotadi?", "o": ["SSD", "HDD", "RAM", "USB fleshka"], "a": 2, "e": "RAM energiyaga bog‘liq xotiradir."}, {"q": "OS va foydalanuvchi fayllari qayerda doimiy saqlanadi?", "o": ["CPU registrlari", "SSD", "CPU cache", "RAM"], "a": 1, "e": "SSD doimiy saqlash qurilmasidir."}, {"q": "Motherboard vazifasi qaysi?", "o": ["Faqat grafikani chizish", "Komponentlarni birlashtirish", "Faqat viruslarni aniqlash", "OS o‘rnida ishlash"], "a": 1, "e": "Asosiy plata komponentlar ulanishini ta’minlaydi."}, {"q": "Operatsion tizimning vazifasi nima?", "o": ["Faqat matn yozish", "Faqat antivirus bo‘lish", "Resurslar va dasturlarni boshqarish", "Faqat fayllarni siqish"], "a": 2, "e": "OS jarayonlar, xotira, qurilmalar va ruxsatlarni boshqaradi."}, {"q": "Kernel nima?", "o": ["Kompyuter korpusi", "Operatsion tizimning markaziy qismi", "Brauzer kengaytmasi", "SSD bo‘limi"], "a": 1, "e": "Kernel OS ning markaziy komponentidir."}, {"q": "User Mode dasturlarining cheklovi qaysi?", "o": ["RAM ishlata olmaydi", "Kernel xotirasiga bevosita kira olmaydi", "Internetga ulana olmaydi", "Faqat bitta thread ishlatadi"], "a": 1, "e": "User Mode kernel xotirasidan himoyalangan."}, {"q": "Kernel Mode nimani anglatadi?", "o": ["Administrator parolini bilish", "CPU ning yuqori imtiyozli rejimi", "Faqat Linux terminali", "Xavfsiz yuklanish"], "a": 1, "e": "Kernel Mode bajarilish rejimidir."}, {"q": "Administrator dasturi doimo Kernel Mode dami?", "o": ["Ha", "Yo‘q", "Faqat Chrome da", "Faqat SSD to‘la bo‘lsa"], "a": 1, "e": "Administrator huquqi va Kernel Mode boshqa tushunchalar."}, {"q": "System call nima?", "o": ["Monitor tugmasi", "Kernel xizmatiga murojaat mexanizmi", "Fayl kengaytmasi", "CPU ishlab chiqaruvchisi"], "a": 1, "e": "System call orqali kernel xizmatlari so‘raladi."}, {"q": "Process nima?", "o": ["Doimiy fayl turi", "Bajarilayotgan dastur instansiyasi", "CPU yadrosi", "Tarmoq kabeli"], "a": 1, "e": "Process — bajarilayotgan dastur instansiyasi."}, {"q": "PID nimani bildiradi?", "o": ["Process Identifier", "Password Identification Data", "Processor Internal Disk", "Private Internet Domain"], "a": 0, "e": "PID — Process Identifier."}, {"q": "Bitta dastur bir nechta PID bilan ko‘rinishi mumkinmi?", "o": ["Yo‘q", "Ha, bir nechta jarayon ishlatsa", "Faqat Windows 7 da", "Faqat administrator bo‘lsa"], "a": 1, "e": "Ko‘p jarayonli dastur bir nechta PID ga ega bo‘ladi."}, {"q": "Thread nima?", "o": ["SSD bo‘limi", "Jarayon ichidagi bajarilish oqimi", "Administrator paroli", "Fayl ruxsati"], "a": 1, "e": "Thread — jarayon ichidagi bajarilish oqimi."}, {"q": "Bir jarayondagi threadlar nimani bo‘lishadi?", "o": ["Faqat PID ni", "Xotira manzil makoni va resurslarini", "Alohida OS ni", "Hech narsani"], "a": 1, "e": "Threadlar jarayonning umumiy resurslaridan foydalanadi."}, {"q": "WorkingSet64 nimani bildiradi?", "o": ["CPU chastotasini", "Jismoniy RAMdagi working set hajmini", "Diskdagi fayllarni", "Tarmoq tezligini"], "a": 1, "e": "WorkingSet64 baytlarda ifodalanadi."}, {"q": "whoami nima qiladi?", "o": ["Joriy hisobni ko‘rsatadi", "RAM ni tozalaydi", "Jarayonni o‘chiradi", "Firewall ni o‘chiradi"], "a": 0, "e": "whoami joriy foydalanuvchini ko‘rsatadi."}, {"q": "whoami /groups nima qiladi?", "o": ["Diskni formatlaydi", "Joriy token guruhlarini ko‘rsatadi", "IP ni o‘zgartiradi", "Windows ni yangilaydi"], "a": 1, "e": "Joriy token guruhlari va atributlari ko‘rsatiladi."}, {"q": "Oddiy hisob ruxsatsiz administrator bo‘ldi. Bu nima?", "o": ["Horizontal escalation", "Vertical escalation", "Compression", "Backup"], "a": 1, "e": "Yuqori huquqqa ko‘tarilish vertical escalation."}, {"q": "A mijoz B mijoz ma’lumotiga ruxsatsiz kirdi. Bu nima?", "o": ["Horizontal escalation", "CPU scheduling", "Defragmentation", "Kernel compilation"], "a": 0, "e": "Teng darajadagi boshqa hisob resursiga kirish horizontal escalation."}];let answers={},graded=false;const root=document.getElementById('questions'),submit=document.getElementById('submit'),restart=document.getElementById('restart'),result=document.getElementById('result');
function render(){root.innerHTML='';questions.forEach((q,i)=>{let section=document.createElement('section');section.className='question'+(graded?(answers[i]===q.a?' correct':' incorrect'):'');let h=document.createElement('h3');h.textContent=(i+1)+'. '+q.q;section.append(h);q.o.forEach((option,j)=>{let lab=document.createElement('label');lab.className='option';let radio=document.createElement('input');radio.type='radio';radio.name='q'+i;radio.value=j;radio.checked=answers[i]===j;radio.disabled=graded;radio.addEventListener('change',()=>{answers[i]=j;update()});lab.append(radio,document.createTextNode(option));section.append(lab)});if(graded){let exp=document.createElement('div');exp.className='explain';exp.textContent=(answers[i]===q.a?'✓ To‘g‘ri. ':'✗ To‘g‘ri javob: '+q.o[q.a]+'. ')+q.e;section.append(exp)}root.append(section)});update()}
function update(){let n=Object.keys(answers).length;document.getElementById('count').textContent=n+' / '+questions.length+' javob berildi';document.getElementById('progress').style.width=(100*n/questions.length)+'%';submit.disabled=n!==questions.length||graded}
submit.onclick=()=>{graded=true;let score=questions.reduce((s,q,i)=>s+(answers[i]===q.a),0);result.classList.remove('hide');result.innerHTML='<h2>Natija: '+(score*5)+'/100</h2><p>'+score+' ta to‘g‘ri, '+(questions.length-score)+' ta xato.</p><p>Har bir savol ostida javob va izoh ko‘rsatilgan.</p>';submit.classList.add('hide');restart.classList.remove('hide');render();result.scrollIntoView({behavior:'smooth'})};restart.onclick=()=>{answers={};graded=false;result.classList.add('hide');submit.classList.remove('hide');restart.classList.add('hide');render();window.scrollTo({top:0,behavior:'smooth'})};render();</script></body></html>
